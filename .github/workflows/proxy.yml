name: 离线打包代理插件及全部依赖 (亚瑟/太乙/雅典娜)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择设备'
        required: true
        type: choice
        options:
          - 亚瑟 (arm_cortex-a7, qualcommax/ipq60xx)
          - 太乙 (arm_cortex-a7, qualcommax/ipq53xx)
          - 雅典娜 (aarch64_cortex-a53, qualcommax/ipq807x)
      openwrt_version:
        description: 'OpenWrt 版本 (影响软件源)'
        required: true
        type: string
        default: '23.05'
        # 如果将来升级到 25.10，在此修改

jobs:
  download-packages:
    runs-on: ubuntu-latest
    steps:
      - name: 设置设备架构和源
        id: config
        run: |
          case "${{ github.event.inputs.device }}" in
            "亚瑟 (arm_cortex-a7, qualcommax/ipq60xx)")
              echo "ARCH=arm_cortex-a7" >> $GITHUB_OUTPUT
              echo "FEED_ARCH=arm_cortex-a7" >> $GITHUB_OUTPUT
              echo "TARGET=qualcommax/ipq60xx" >> $GITHUB_OUTPUT
              ;;
            "太乙 (arm_cortex-a7, qualcommax/ipq53xx)")
              echo "ARCH=arm_cortex-a7" >> $GITHUB_OUTPUT
              echo "FEED_ARCH=arm_cortex-a7" >> $GITHUB_OUTPUT
              echo "TARGET=qualcommax/ipq53xx" >> $GITHUB_OUTPUT
              ;;
            "雅典娜 (aarch64_cortex-a53, qualcommax/ipq807x)")
              echo "ARCH=aarch64_cortex-a53" >> $GITHUB_OUTPUT
              echo "FEED_ARCH=aarch64_cortex-a53" >> $GITHUB_OUTPUT
              echo "TARGET=qualcommax/ipq807x" >> $GITHUB_OUTPUT
              ;;
          esac
          
          # ImmortalWrt 23.05 稳定版软件源 (可根据需要修改)
          echo "BASE_URL=https://downloads.immortalwrt.org/releases/${{ github.event.inputs.openwrt_version }}/targets/${TARGET}" >> $GITHUB_OUTPUT
          echo "PACKAGES_URL=https://downloads.immortalwrt.org/releases/${{ github.event.inputs.openwrt_version }}/packages/${ARCH}" >> $GITHUB_OUTPUT
          # 第三方软件源 (kenzok8 的 openwrt-packages 和 small，以及 OpenClash 官方源)
          echo "CUSTOM_URL_KENZOK8=https://op.dllkids.xyz/packages/${ARCH}/kenzok8" >> $GITHUB_OUTPUT
          echo "CUSTOM_URL_SMALL=https://op.dllkids.xyz/packages/${ARCH}/small" >> $GITHUB_OUTPUT
          echo "CUSTOM_URL_OPENCLASH=https://op.dllkids.xyz/packages/${ARCH}/openclash" >> $GITHUB_OUTPUT

      - name: 安装 opkg 工具
        run: |
          sudo apt-get update
          sudo apt-get install -y opkg libarchive-tools

      - name: 配置 opkg 源并下载所有包
        run: |
          # 创建工作目录
          mkdir -p offline_packages
          
          # 准备 opkg 配置文件
          cat > opkg.conf <<EOF
          dest root /
          dest ram /tmp
          lists_dir ext /var/opkg-lists
          option overlay_root /overlay
          option check_signature 0
          arch ${{ steps.config.outputs.FEED_ARCH }} 10
          arch all 100
          arch ${{ steps.config.outputs.FEED_ARCH }}_r1 200
          
          src/gz immortalwrt_core ${{ steps.config.outputs.BASE_URL }}/packages
          src/gz immortalwrt_base ${{ steps.config.outputs.PACKAGES_URL }}/base
          src/gz immortalwrt_luci ${{ steps.config.outputs.PACKAGES_URL }}/luci
          src/gz immortalwrt_packages ${{ steps.config.outputs.PACKAGES_URL }}/packages
          src/gz immortalwrt_routing ${{ steps.config.outputs.PACKAGES_URL }}/routing
          src/gz immortalwrt_telephony ${{ steps.config.outputs.PACKAGES_URL }}/telephony
          
          src/gz kenzok8_packages ${{ steps.config.outputs.CUSTOM_URL_KENZOK8 }}
          src/gz kenzok8_small ${{ steps.config.outputs.CUSTOM_URL_SMALL }}
          src/gz openclash ${{ steps.config.outputs.CUSTOM_URL_OPENCLASH }}
          EOF
          
          # 更新软件包列表
          sudo opkg -f opkg.conf update
          
          # 下载四个插件及全部依赖（仅下载，不安装）
          # 使用 --force-depends 强制解析依赖，--download-only 只下载到缓存
          # 必须指定 dest 为 ram，否则会尝试安装到 / 
          for pkg in luci-app-passwall luci-app-passwall2 luci-app-openclash luci-app-ssr-plus; do
            sudo opkg -f opkg.conf --dest ram install --download-only --force-depends $pkg 2>&1 | tee -a download.log
          done
          
          # 所有下载的 ipk 默认存放在 /var/cache/opkg/ 下
          # 拷贝出来
          sudo cp /var/cache/opkg/*.ipk offline_packages/ 2>/dev/null || true
          
          # 有些包可能被下载到工作目录的其他位置，再保险一点
          find /var/cache/ -name "*.ipk" -exec cp {} offline_packages/ \; 2>/dev/null || true
          
          # 删除无关的索引文件
          rm -f offline_packages/Packages*

      - name: 打包离线包
        run: |
          tar -czf offline-packages-${{ steps.config.outputs.TARGET }}.tar.gz offline_packages/
          echo "离线包已生成：offline-packages-${{ steps.config.outputs.TARGET }}.tar.gz"

      - name: 上传到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-packages-${{ steps.config.outputs.TARGET }}
          path: offline-packages-${{ steps.config.outputs.TARGET }}.tar.gz
