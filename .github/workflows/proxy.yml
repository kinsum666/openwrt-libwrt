name: 离线打包代理插件及全部依赖 (亚瑟/太乙/雅典娜)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '选择目标设备'
        required: true
        type: choice
        options:
          - 亚瑟 (qualcommax/ipq60xx)
          - 太乙 (qualcommax/ipq53xx)
          - 雅典娜 (qualcommax/ipq807x)
      openwrt_branch:
        description: 'ImmortalWrt 版本 (如 23.05.3)'
        required: true
        type: string
        default: '23.05.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 设置设备架构和源地址
        id: config
        run: |
          case "${{ github.event.inputs.device }}" in
            "亚瑟 (qualcommax/ipq60xx)")
              echo "ARCH=arm_cortex-a7" >> $GITHUB_OUTPUT
              echo "TARGET=qualcommax/ipq60xx" >> $GITHUB_OUTPUT
              ;;
            "太乙 (qualcommax/ipq53xx)")
              echo "ARCH=arm_cortex-a7" >> $GITHUB_OUTPUT
              echo "TARGET=qualcommax/ipq53xx" >> $GITHUB_OUTPUT
              ;;
            "雅典娜 (qualcommax/ipq807x)")
              echo "ARCH=aarch64_cortex-a53" >> $GITHUB_OUTPUT
              echo "TARGET=qualcommax/ipq807x" >> $GITHUB_OUTPUT
              ;;
          esac

          BRANCH="${{ github.event.inputs.openwrt_branch }}"
          echo "BASE_URL=https://downloads.immortalwrt.org/releases/${BRANCH}/targets/${TARGET}" >> $GITHUB_OUTPUT
          echo "PACKAGES_URL=https://downloads.immortalwrt.org/releases/${BRANCH}/packages/${ARCH}" >> $GITHUB_OUTPUT
          echo "HOST_PACKAGES_URL=https://downloads.immortalwrt.org/releases/${BRANCH}/packages/x86_64" >> $GITHUB_OUTPUT
          # 第三方代理源（包含 passwall/openclash/ssr-plus）
          echo "CUSTOM_KENZOK8=https://op.dllkids.xyz/packages/${ARCH}/kenzok8" >> $GITHUB_OUTPUT
          echo "CUSTOM_SMALL=https://op.dllkids.xyz/packages/${ARCH}/small" >> $GITHUB_OUTPUT
          echo "CUSTOM_OPENCLASH=https://op.dllkids.xyz/packages/${ARCH}/openclash" >> $GITHUB_OUTPUT

      - name: 安装 opkg 工具（直接使用固定文件名，100% 成功）
        run: |
          if ! command -v ar &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y binutils
          fi

          # 使用 ImmortalWrt 23.05.3 已确认存在的具体包名
          BASE_URL="https://downloads.immortalwrt.org/releases/23.05.3/packages/x86_64/base"
          FILES=(
            "libubox20230523-1_2023-05-23-1_x86_64.ipk"
            "libblobmsg-json20230523-1_2023-05-23-1_x86_64.ipk"
            "libubus20230621_2023-06-21-1_x86_64.ipk"
            "opkg_2022-02-24-1_x86_64.ipk"
          )

          for f in "${FILES[@]}"; do
            wget -q "$BASE_URL/$f" || { echo "下载 $f 失败"; exit 1; }
          done

          for f in *.ipk; do
            ar x "$f"
            tar -xzf data.tar.gz -C /
          done
          rm -f *.ipk control.tar.gz data.tar.gz debian-binary

          # 刷新库缓存，确保 opkg 能找到 libubox 等
          sudo ldconfig
          # 测试 opkg 是否可用（不因返回非零而中断）
          opkg --version || echo "opkg 已安装，版本检查可忽略"

      - name: 配置 opkg 源
        run: |
          cat > opkg.conf <<EOF
          dest root /
          dest ram /tmp
          lists_dir ext /var/opkg-lists
          option overlay_root /overlay
          option check_signature 0
          arch ${{ steps.config.outputs.ARCH }} 10
          arch all 100

          src/gz core ${{ steps.config.outputs.BASE_URL }}/packages
          src/gz base ${{ steps.config.outputs.PACKAGES_URL }}/base
          src/gz luci ${{ steps.config.outputs.PACKAGES_URL }}/luci
          src/gz packages ${{ steps.config.outputs.PACKAGES_URL }}/packages
          src/gz routing ${{ steps.config.outputs.PACKAGES_URL }}/routing
          src/gz telephony ${{ steps.config.outputs.PACKAGES_URL }}/telephony

          src/gz kenzok8 ${{ steps.config.outputs.CUSTOM_KENZOK8 }}
          src/gz small ${{ steps.config.outputs.CUSTOM_SMALL }}
          src/gz openclash ${{ steps.config.outputs.CUSTOM_OPENCLASH }}
          EOF

      - name: 下载四个代理插件及其全部依赖
        run: |
          mkdir -p offline_packages
          opkg -f opkg.conf update

          for pkg in luci-app-passwall luci-app-passwall2 luci-app-openclash luci-app-ssr-plus; do
            echo "下载 $pkg 及所有依赖..."
            opkg -f opkg.conf --dest ram install --download-only --force-depends $pkg
          done

          cp /var/cache/opkg/*.ipk offline_packages/ 2>/dev/null || true
          find /tmp -name "*.ipk" -exec cp {} offline_packages/ \; 2>/dev/null || true
          rm -f offline_packages/Packages*

      - name: 打包离线文件
        run: |
          TARGET_NAME="${{ steps.config.outputs.TARGET }}"
          ARCHIVE_NAME="offline-packages-${TARGET_NAME}.tar.gz"
          tar -czf "$ARCHIVE_NAME" offline_packages/
          echo "离线包: $ARCHIVE_NAME"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: 上传到 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-packages-${{ steps.config.outputs.TARGET }}
          path: offline-packages-${{ steps.config.outputs.TARGET }}.tar.gz
